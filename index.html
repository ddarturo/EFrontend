<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=capa3_frontend/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EFrontend - Cargando Catálogo de Productos</title>
  <script>
    window.location.replace("capa3_frontend/");
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 480px;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Cargando Catálogo de Productos...</h2>
    <p style="color: #64748b; margin-top: 0.5rem; margin-bottom: 1.5rem;">
      Redireccionando a la interfaz de usuario en <code>capa3_frontend</code>.
    </p>
    <p>
      Si no eres redirigido automáticamente, <a href="capa3_frontend/">haz clic aquí para entrar</a>.
    </p>
  </div>
</body>
</html>
